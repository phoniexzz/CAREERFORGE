services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: careerforge
      MYSQL_USER: careerforge
      MYSQL_PASSWORD: careerforge
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - careerforge_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-plocal-root-password",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    volumes:
      - careerforge_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen2.5:14b}"]
    depends_on:
      ollama:
        condition: service_healthy

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql+asyncmy://careerforge:careerforge@mysql:3306/careerforge
      OLLAMA_BASE_URL: http://ollama:11434
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql+asyncmy://careerforge:careerforge@mysql:3306/careerforge
      OLLAMA_BASE_URL: http://ollama:11434
    command: python -m app.worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy

volumes:
  careerforge_mysql:
  careerforge_ollama:
